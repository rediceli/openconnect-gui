[package]
name = "oc-gui-helper"
version = "0.1.0"
edition = "2024"
description = "OC GUI Linux 特权助手（polkit + 每用户 socket）"
license = "Apache-2.0"

[[bin]]
name = "oc-gui-helper"
path = "src/main.rs"

[dependencies]
oc-proto = { path = "../crates/oc-proto" }
serde_json = "1.0"
libc = "0.2"
rand = "0.9"

[dev-dependencies]
tempfile = "3"
