[package]
name = "wthinkvpn-helper-win"
version = "0.1.0"
edition = "2024"
description = "WthinkVPN Windows 特权助手（named pipe）"

[[bin]]
name = "wthinkvpn-helper"
path = "src/main.rs"

[dependencies]
oc-proto = { path = "../crates/oc-proto" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Console",
] }

[dev-dependencies]
tempfile = "3"
